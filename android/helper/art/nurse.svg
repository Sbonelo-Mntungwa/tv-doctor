<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    TV Nurse: TV Doctor's set, mirrored. The dials sit on the left and the
    screen on the right; the screen carries a nurse's cross in place of the
    doctor's heartbeat, and the light under the dials is a small heart.
  -->
  <defs>
    <radialGradient id="tile" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#173a40"/>
      <stop offset=".6" stop-color="#0e2226"/>
      <stop offset="1" stop-color="#091619"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="warm" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#tile)" stroke="#1d3a40" stroke-width="3"/>

  <g fill="none" stroke="#4fd1c5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- rabbit ears and their signal -->
    <path d="M482 358 L398 280" stroke-width="30"/>
    <path d="M542 358 L626 280" stroke-width="30"/>
    <circle cx="398" cy="280" r="27" fill="#4fd1c5" stroke="none"/>
    <circle cx="626" cy="280" r="27" fill="#4fd1c5" stroke="none"/>
    <path d="M318 262 A86 86 0 0 1 378 200" stroke-width="22"/>
    <path d="M350 268 A52 52 0 0 1 386 232" stroke-width="22"/>
    <path d="M706 262 A86 86 0 0 0 646 200" stroke-width="22"/>
    <path d="M674 268 A52 52 0 0 0 638 232" stroke-width="22"/>

    <!-- cabinet and legs -->
    <rect x="210" y="374" width="604" height="386" rx="60" stroke-width="30" fill="#4fd1c5" fill-opacity=".1"/>
    <path d="M282 776 L258 822" stroke-width="28"/>
    <path d="M742 776 L766 822" stroke-width="28"/>

    <!-- dials, now on the left -->
    <circle cx="305" cy="478" r="42" stroke-width="20"/>
    <path d="M305 478 L326 450" stroke-width="20"/>
    <circle cx="305" cy="588" r="42" stroke-width="20"/>
    <path d="M305 588 L284 560" stroke-width="20"/>

    <!-- screen, now on the right -->
    <rect x="398" y="420" width="368" height="292" rx="56" stroke-width="22" fill="#4fd1c5" fill-opacity=".2"/>
  </g>

  <!-- the light under the dials is a heart -->
  <path d="M305 712 C 270 686, 272 652, 296 650 C 302 650, 305 656, 305 662 C 305 656, 308 650, 314 650 C 338 652, 340 686, 305 712 Z"
        fill="#4fd1c5" filter="url(#glow)"/>

  <!-- the nurse's cross, in TV Doctor's amber -->
  <path d="M556 486 h52 v52 h52 v52 h-52 v52 h-52 v-52 h-52 v-52 h52 Z"
        fill="#ffd27a" stroke="#ffd27a" stroke-width="14" stroke-linejoin="round" filter="url(#warm)"/>
</svg>
